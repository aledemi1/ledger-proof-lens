name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sverko
          POSTGRES_PASSWORD: sverko
          POSTGRES_DB: sverko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sverko -d sverko_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Fonts and Python for fixtures and the privacy stub
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation python3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: PostgreSQL store
        run: bun run test:pg
        env:
          DATABASE_URL: postgres://sverko:sverko@localhost:5432/sverko_test
